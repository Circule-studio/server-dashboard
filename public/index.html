<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Server Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='10' width='35' height='35' rx='8' fill='%237c9cff'/><rect x='55' y='10' width='35' height='35' rx='8' fill='%2334d399'/><rect x='10' y='55' width='35' height='35' rx='8' fill='%2334d399'/><rect x='55' y='55' width='35' height='35' rx='8' fill='%237c9cff'/></svg>">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Les textes sont traduits par i18n.js (attributs data-i18n*). -->
  <header class="topbar">
    <div class="brand">
      <h1 id="title">Server Dashboard</h1>
      <span id="host" class="muted"></span>
    </div>
    <div class="topbar-right">
      <div class="search-wrap">
        <input id="search" class="search" type="search" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="searchMenu" aria-expanded="false"
          data-i18n-placeholder="search.placeholder" data-i18n-aria="search.aria" hidden>
        <!-- Suggestions : tuiles, adresse à ouvrir, recherche web (#91). -->
        <ul id="searchMenu" class="search-menu" role="listbox" hidden></ul>
      </div>
      <span id="clock" class="clock"></span>
      <button id="themeBtn" class="btn btn-ghost btn-icon"></button>
      <button id="langBtn" class="btn btn-ghost btn-lang" data-i18n="lang.switch" data-i18n-title="lang.switchTitle"></button>
      <button id="editBtn" class="btn" data-i18n="btn.edit" hidden></button>
      <button id="authBtn" class="btn btn-ghost" data-i18n="btn.login"></button>
    </div>
  </header>

  <div id="pwBanner" class="banner" role="alert" data-i18n-html="banner.defaultPassword" hidden></div>

  <div id="editBar" class="editbar" hidden>
    <span data-i18n="edit.hint"></span>
    <div class="editbar-actions">
      <button id="renameBoardBtn" class="btn btn-ghost" data-i18n="edit.renameBoard"></button>
      <button id="addWidgetBtn" class="btn btn-ghost" data-i18n="edit.addWidget"></button>
      <button id="disksBtn" class="btn btn-ghost" data-i18n="edit.disks"></button>
      <button id="displayBtn" class="btn btn-ghost" data-i18n="edit.display"></button>
      <button id="notifyBtn" class="btn btn-ghost" data-i18n="edit.notify"></button>
      <button id="backupBtn" class="btn btn-ghost" data-i18n="edit.backup"></button>
      <button id="addCatBtn" class="btn btn-ghost" data-i18n="edit.addCategory"></button>
      <button id="cancelBtn" class="btn btn-ghost" data-i18n="edit.done"></button>
    </div>
  </div>

  <section id="stats" class="stats" data-i18n-aria="stats.aria">
    <div class="stat" id="stat-cpu" data-stat="cpu"><div class="stat-head"><span data-i18n="stat.cpu"></span><b>–</b></div><div class="bar"><i></i></div><small class="muted"></small></div>
    <div class="stat" id="stat-mem" data-stat="mem"><div class="stat-head"><span data-i18n="stat.memory"></span><b>–</b></div><div class="bar"><i></i></div><small class="muted"></small></div>
    <div class="stat" id="stat-up" data-stat="up"><div class="stat-head"><span data-i18n="stat.uptime"></span><b>–</b></div><small class="muted"></small></div>
  </section>


  <main id="board" class="board"></main>

  <section id="dockerSection" class="panel">
    <div class="panel-head">
      <h2 data-i18n="docker.title"></h2>
      <span id="dockerSummary" class="muted"></span>
    </div>
    <div id="dockerBody"></div>
  </section>

  <dialog id="loginDialog">
    <form method="dialog" id="loginForm">
      <h3 data-i18n="login.title"></h3>
      <label><span data-i18n="login.password"></span><input type="password" name="password" required autocomplete="current-password"></label>
      <p class="error" id="loginError"></p>
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" data-close data-i18n="common.cancel"></button>
        <button class="btn btn-primary" data-i18n="login.submit"></button>
      </div>
    </form>
  </dialog>

  <dialog id="appDialog">
    <form method="dialog" id="appForm">
      <h3 id="appDialogTitle" data-i18n="app.dialogTitle"></h3>
      <label data-catalog><span data-i18n="app.catalog"></span>
        <input name="catalog" type="search" list="appCatalog" autocomplete="off" data-i18n-placeholder="app.catalogPlaceholder">
        <small class="muted" data-i18n="app.catalogHelp"></small>
      </label>
      <datalist id="appCatalog"></datalist>
      <label><span data-i18n="common.name"></span><input name="name" required maxlength="100"></label>
      <label><span data-i18n="app.url"></span><input name="url" type="url" required placeholder="http://192.168.1.10:8096"></label>
      <label><span data-i18n="app.icon"></span>
        <input name="icon" data-i18n-placeholder="app.iconPlaceholder">
        <small class="muted" data-i18n-html="app.iconHelp"></small>
      </label>
      <label><span data-i18n="app.description"></span><input name="description" maxlength="200"></label>
      <label><span data-i18n="app.category"></span><select name="category"></select></label>
      <label><span data-i18n="app.link"></span><select name="link"></select>
        <small class="muted" data-i18n="app.linkHelp"></small>
      </label>
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" data-close data-i18n="common.cancel"></button>
        <button class="btn btn-primary" data-i18n="common.ok"></button>
      </div>
    </form>
  </dialog>

  <dialog id="widgetDialog">
    <form method="dialog" id="widgetForm">
      <h3 id="widgetDialogTitle" data-i18n="widget.dialogTitle"></h3>
      <label><span data-i18n="widget.type"></span><select name="type"></select></label>
      <label><span data-i18n="common.name"></span><input name="name" maxlength="100" data-i18n-placeholder="widget.namePlaceholder"></label>
      <label data-field="location"><span data-i18n="widget.location"></span>
        <input name="location" maxlength="200" autocomplete="off" data-i18n-placeholder="widget.locationPlaceholder">
        <small class="muted" data-i18n="widget.locationHelp"></small>
      </label>
      <label data-field="repo"><span data-i18n="widget.repo"></span>
        <input name="repo" maxlength="300" autocomplete="off" data-i18n-placeholder="widget.repoPlaceholder">
        <small class="muted" data-i18n="widget.repoHelp"></small>
      </label>
      <label data-field="slug"><span data-i18n="widget.slug"></span>
        <input name="slug" maxlength="100" autocomplete="off" data-i18n-placeholder="widget.slugPlaceholder">
        <small class="muted" data-i18n="widget.slugHelp"></small>
      </label>
      <label data-field="url"><span data-url-label></span>
        <input name="url" type="url" required placeholder="http://192.168.1.10:8096">
        <small class="muted" data-url-help></small>
      </label>
      <label data-field="feeds"><span data-i18n="widget.feeds"></span>
        <textarea name="feeds" rows="3" autocomplete="off" spellcheck="false" placeholder="https://example.com/feed.xml"></textarea>
        <small class="muted" data-i18n="widget.feedsHelp"></small>
      </label>
      <label data-field="mappings"><span data-i18n="widget.mappings"></span>
        <textarea name="mappings" rows="4" autocomplete="off" spellcheck="false" data-i18n-placeholder="widget.mappingsPlaceholder"></textarea>
        <small class="muted" data-i18n="widget.mappingsHelp"></small>
      </label>
      <label data-field="entities"><span data-i18n="widget.entities"></span>
        <textarea name="entities" rows="4" autocomplete="off" spellcheck="false" data-i18n-placeholder="widget.entitiesPlaceholder"></textarea>
        <small class="muted" data-i18n="widget.entitiesHelp"></small>
      </label>
      <label data-field="apiKey"><span data-key-label></span>
        <input name="apiKey" type="password" autocomplete="off">
        <small class="muted" data-key-help></small>
      </label>
      <label class="check-inline" data-clear="apiKey" hidden><input type="checkbox" name="clearApiKey"><span data-i18n="widget.clearKey"></span></label>
      <label data-field="username"><span data-user-label></span><input name="username" autocomplete="off"></label>
      <label data-field="password"><span data-password-label></span>
        <input name="password" type="password" autocomplete="new-password">
        <small class="muted" data-password-help></small>
      </label>
      <label class="check-inline" data-clear="password" hidden><input type="checkbox" name="clearPassword"><span data-i18n="widget.clearPassword"></span></label>
      <div class="agent-setup" data-agent-setup hidden>
        <p class="muted" data-agent-setup-text></p>
        <div data-agent-setup-commands></div>
      </div>
      <div data-alert hidden>
        <label class="check-inline"><input type="checkbox" name="alert"><span data-i18n="widget.alert"></span></label>
        <small class="muted" data-alert-help></small>
      </div>
      <fieldset class="sections" data-sections hidden>
        <legend data-i18n="widget.sections"></legend>
        <div data-sections-list></div>
        <small class="muted" data-i18n="widget.sectionsHelp"></small>
      </fieldset>
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" data-close data-i18n="common.cancel"></button>
        <button class="btn btn-primary" data-i18n="common.ok"></button>
      </div>
    </form>
  </dialog>

  <dialog id="disksDialog">
    <form method="dialog" id="disksForm">
      <h3 data-i18n="disks.title"></h3>
      <p class="muted dialog-help" data-i18n="disks.help"></p>
      <div id="disksList" class="disks-list"></div>
      <label><span data-i18n="disks.extra"></span>
        <input name="extra" data-i18n-placeholder="disks.extraPlaceholder">
        <small class="muted" data-i18n="disks.extraHelp"></small>
      </label>
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" data-close data-i18n="common.cancel"></button>
        <button class="btn btn-primary" data-i18n="common.ok"></button>
      </div>
    </form>
  </dialog>

  <dialog id="notifyDialog">
    <form method="dialog" id="notifyForm">
      <h3 data-i18n="notify.title"></h3>
      <p class="muted dialog-help" data-i18n="notify.help"></p>
      <label><span data-i18n="notify.type"></span><select name="type"></select></label>
      <label data-notify-field="url"><span data-i18n="notify.url"></span>
        <input name="url" type="url" autocomplete="off">
        <small class="muted" data-notify-url-help></small>
      </label>
      <label data-notify-field="token"><span data-notify-token-label></span>
        <input name="token" type="password" autocomplete="off">
        <small class="muted" data-notify-token-help></small>
      </label>
      <label class="check-inline" data-notify-clear hidden><input type="checkbox" name="clearToken"><span data-i18n="widget.clearKey"></span></label>
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost notify-test" data-notify-test data-i18n="notify.test"></button>
        <button type="button" class="btn btn-ghost" data-close data-i18n="common.cancel"></button>
        <button class="btn btn-primary" data-i18n="common.ok"></button>
      </div>
    </form>
  </dialog>

  <dialog id="backupDialog">
    <form method="dialog" id="backupForm">
      <h3 data-i18n="backup.title"></h3>
      <fieldset class="sections">
        <legend data-i18n="backup.export"></legend>
        <label class="check"><input type="checkbox" name="secrets"><span data-i18n="backup.withSecrets"></span></label>
        <small class="muted" data-i18n="backup.exportHelp"></small>
        <p class="backup-warning" data-backup-warning hidden data-i18n="backup.secretsWarning"></p>
        <button type="button" class="btn" data-backup-export data-i18n="backup.download"></button>
      </fieldset>
      <fieldset class="sections">
        <legend data-i18n="backup.import"></legend>
        <small class="muted" data-i18n="backup.importHelp"></small>
        <input type="file" name="file" accept="application/json,.json" hidden>
        <button type="button" class="btn" data-backup-import data-i18n="backup.chooseFile"></button>
      </fieldset>
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" data-close data-i18n="common.close"></button>
      </div>
    </form>
  </dialog>

  <dialog id="displayDialog">
    <form method="dialog" id="displayForm">
      <h3 data-i18n="display.title"></h3>
      <fieldset class="sections">
        <legend data-i18n="display.legend"></legend>
        <label class="check"><input type="checkbox" name="search"><span data-i18n="display.search"></span></label>
        <label class="check"><input type="checkbox" name="theme"><span data-i18n="display.theme"></span></label>
        <label class="check"><input type="checkbox" name="lang"><span data-i18n="display.lang"></span></label>
        <small class="muted" data-i18n="display.help"></small>
      </fieldset>
      <fieldset class="sections">
        <legend data-i18n="display.engine"></legend>
        <select name="searchEngine">
          <option value="duckduckgo">DuckDuckGo</option>
          <option value="google">Google</option>
          <option value="bing">Bing</option>
          <option value="brave">Brave</option>
          <option value="qwant">Qwant</option>
          <option value="ecosia">Ecosia</option>
          <option value="custom" data-i18n="display.engineCustom"></option>
          <option value="none" data-i18n="display.engineNone"></option>
        </select>
        <label data-engine-url hidden><span data-i18n="display.engineUrl"></span>
          <input name="searchUrl" type="url" autocomplete="off" placeholder="https://search.example.com/?q=%s">
          <small class="muted" data-i18n="display.engineUrlHelp"></small>
        </label>
        <small class="muted" data-i18n="display.engineHelp"></small>
      </fieldset>
      <fieldset class="sections">
        <legend data-i18n="display.tiles"></legend>
        <label class="check"><input type="radio" name="tileSize" value="compact"><span data-i18n="display.tileCompact"></span></label>
        <label class="check"><input type="radio" name="tileSize" value="normal"><span data-i18n="display.tileNormal"></span></label>
        <label class="check"><input type="radio" name="tileSize" value="large"><span data-i18n="display.tileLarge"></span></label>
      </fieldset>
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" data-close data-i18n="common.cancel"></button>
        <button class="btn btn-primary" data-i18n="common.ok"></button>
      </div>
    </form>
  </dialog>

  <dialog id="textDialog">
    <form method="dialog" id="textForm">
      <h3 id="textDialogTitle"></h3>
      <label><span id="textDialogLabel"></span><input name="value" required maxlength="100"></label>
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" data-close data-i18n="common.cancel"></button>
        <button class="btn btn-primary" data-i18n="common.ok"></button>
      </div>
    </form>
  </dialog>

  <!-- Visible en mode édition dès qu'il y a des modifications non enregistrées. -->
  <div id="saveBar" class="savebar" role="region" data-i18n-aria="save.region" hidden>
    <span data-i18n="save.pending"></span>
    <button id="discardBtn" class="btn btn-ghost" data-i18n="common.cancel"></button>
    <button id="saveBtn" class="btn btn-primary" data-i18n-title="save.shortcut" data-i18n="common.save"></button>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="i18n.js"></script>
  <script src="catalog.js"></script>
  <script src="app.js"></script>
  <!-- Un fichier par widget, dans l'ordre de la liste « Type » du formulaire. -->
  <script src="widgets/pulse.js"></script>
  <script src="widgets/proxmox.js"></script>
  <script src="widgets/pbs.js"></script>
  <script src="widgets/glances.js"></script>
  <script src="widgets/agent.js"></script>
  <script src="widgets/uptimekuma.js"></script>
  <script src="widgets/media.js"></script>
  <script src="widgets/qbittorrent.js"></script>
  <script src="widgets/arr.js"></script>
  <script src="widgets/immich.js"></script>
  <script src="widgets/goaccess.js"></script>
  <script src="widgets/alwaysdata.js"></script>
  <script src="widgets/rss.js"></script>
  <script src="widgets/ical.js"></script>
  <script src="widgets/dns.js"></script>
  <script src="widgets/frigate.js"></script>
  <script src="widgets/homeassistant.js"></script>
  <script src="widgets/npm.js"></script>
  <script src="widgets/weather.js"></script>
  <script src="widgets/github.js"></script>
  <script src="widgets/customapi.js"></script>
</body>
</html>
