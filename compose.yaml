services:
  dashboard:
    # Image publiée à chaque version (amd64 et arm64, ex. Raspberry Pi).
    # Pour construire depuis le code source à la place : remplace cette ligne par « build: . ».
    image: ghcr.io/circule-studio/server-dashboard:latest
    container_name: server-dashboard
    restart: unless-stopped
    ports:
      - "7575:7575"
    environment:
      # Valeurs lues dans le fichier .env (voir .env.example), jamais écrites ici
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Définis ADMIN_PASSWORD dans le fichier .env}
      - SERVER_NAME=${SERVER_NAME:-mon-serveur}
      - REQUIRE_LOGIN=${REQUIRE_LOGIN:-false}
      # Disque affiché dans les stats : la racine de l'hôte montée en lecture seule
      - DISK_PATH=/host
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host:ro
