services:
  dashboard:
    build: .
    container_name: server-dashboard
    restart: unless-stopped
    ports:
      - "7575:7575"
    environment:
      # Valeurs lues dans le fichier .env (voir .env.example), jamais écrites ici
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Définis ADMIN_PASSWORD dans le fichier .env}
      - SERVER_NAME=${SERVER_NAME:-mon-serveur}
      # Disque affiché dans les stats : la racine de l'hôte montée en lecture seule
      - DISK_PATH=/host
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host:ro
