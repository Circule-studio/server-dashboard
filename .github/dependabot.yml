# Mises à jour automatiques des dépendances, proposées en PR vers preprod.
version: 2
updates:
  # Les « mises à jour de sécurité » de GitHub visent toujours main (la CI les
  # bloque) : ce sont ces mises à jour quotidiennes vers preprod, dépendances
  # indirectes comprises, qui apportent les correctifs dans le bon circuit.
  - package-ecosystem: npm
    directory: /
    target-branch: preprod
    schedule:
      interval: daily
    allow:
      - dependency-type: all
    groups:
      correctifs:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    target-branch: preprod
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: /
    target-branch: preprod
    schedule:
      interval: monthly
    commit-message:
      prefix: "docker"
