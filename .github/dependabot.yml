# Mises à jour automatiques des dépendances, proposées en PR vers preprod.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: preprod
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    target-branch: preprod
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: /
    target-branch: preprod
    schedule:
      interval: monthly
    commit-message:
      prefix: "docker"
