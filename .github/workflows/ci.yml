# Vérifications automatiques à chaque push et pull request.
name: CI

on:
  push:
    branches: [main, preprod]
  pull_request:

# Lecture seule : la CI n'a jamais besoin d'écrire dans le dépôt.
permissions:
  contents: read

jobs:
  base-branch:
    name: Branche cible
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Les noms de branche viennent du contributeur : passés en variables, jamais injectés dans le script.
      - name: Seule preprod peut être fusionnée dans main
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$BASE" = "main" ] && { [ "$HEAD" != "preprod" ] || [ "$HEAD_REPO" != "$REPO" ]; }; then
            echo "::error::Les pull requests doivent viser la branche « preprod ». Modifie la branche de base de ta PR (bouton Edit à côté du titre)."
            exit 1
          fi


  checks:
    name: Syntaxe JS et script shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Syntaxe JavaScript
        run: for f in server.js integrations.js dev/mocks.js dev/check-i18n.js public/app.js public/i18n.js public/theme.js; do node --check "$f"; done
      - name: Traductions complètes (fr / en)
        run: node dev/check-i18n.js
      - name: ShellCheck
        run: shellcheck packaging/install.sh

  install:
    name: Installation sans Docker (systemd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Installation
        run: sudo SD_SOURCE_DIR="$GITHUB_WORKSPACE" SD_ADMIN_PASSWORD=ci-test SD_PORT=7575 bash packaging/install.sh

      - name: Le service tourne et répond
        run: |
          systemctl is-active server-dashboard
          curl -fsS http://127.0.0.1:7575/api/me
          curl -fsS http://127.0.0.1:7575/api/system | head -c 300; echo
          curl -fsS http://127.0.0.1:7575/ | grep -q "Server Dashboard"

      - name: Connexion et sauvegarde de la config
        run: |
          curl -fsS -c jar -H 'Content-Type: application/json' -d '{"password":"ci-test"}' http://127.0.0.1:7575/api/login
          curl -fsS http://127.0.0.1:7575/api/config > cfg.json
          node -e 'const c=require("./cfg.json"); c.title="CI"; c.display={search:false}; require("fs").writeFileSync("cfg.json", JSON.stringify(c))'
          curl -fsS -b jar -X PUT -H 'Content-Type: application/json' --data-binary @cfg.json http://127.0.0.1:7575/api/config
          sudo grep -q '"title": "CI"' /var/lib/server-dashboard/config.json
          # Options d'affichage : seule la barre de recherche est masquée.
          curl -fsS http://127.0.0.1:7575/api/config | grep -q '"display":{"search":false,"theme":true,"lang":true}'

      # cfg.json porte maintenant une révision dépassée : le serveur doit refuser
      # de l'enregistrer plutôt que d'écraser la config (issue #25).
      - name: Un vieil onglet ne peut pas écraser la config
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -b jar -X PUT -H 'Content-Type: application/json' --data-binary @cfg.json http://127.0.0.1:7575/api/config)
          test "$code" = 409

      - name: Détection des disques
        run: curl -fsS -b jar http://127.0.0.1:7575/api/disks | tee /dev/stderr | grep -q '"path":"/"'

      # Avant la correction, une URL de widget pointant vers un gros fichier faisait planter le
      # serveur (chaîne trop longue). La réponse doit être refusée et le service rester actif.
      - name: Une réponse trop volumineuse ne fait pas tomber le serveur
        run: |
          node -e 'require("http").createServer((q, r) => { r.writeHead(200); const c = Buffer.alloc(1 << 20, 32); let n = 0; const w = () => { while (n < 300 && r.write(c)) n++; if (n >= 300) r.end(); }; r.on("drain", w); w(); }).listen(9999)' &
          curl -fsS -b jar http://127.0.0.1:7575/api/config > big.json
          node -e 'const c=require("./big.json"); c.widgets=[{id:"big",type:"jellyfin",url:"http://127.0.0.1:9999",apiKey:"x"}]; require("fs").writeFileSync("big.json", JSON.stringify(c))'
          curl -fsS -b jar -X PUT -H 'Content-Type: application/json' --data-binary @big.json http://127.0.0.1:7575/api/config > /dev/null
          curl -s http://127.0.0.1:7575/api/widgets/big | tee /dev/stderr | grep -q '"code":"response_too_large"'
          systemctl is-active server-dashboard
          curl -fsS http://127.0.0.1:7575/api/me

      # Avant la correction, les sessions fermées n'étaient retenues qu'en mémoire :
      # un redémarrage rendait de nouveau valide un cookie déconnecté.
      - name: Une session fermée le reste après un redémarrage
        run: |
          curl -fsS -c old-jar -H 'Content-Type: application/json' -d '{"password":"ci-test"}' http://127.0.0.1:7575/api/login
          curl -fsS -b old-jar -X POST http://127.0.0.1:7575/api/logout
          sudo systemctl restart server-dashboard
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:7575/api/me >/dev/null 2>&1 && break; sleep 1; done
          code=$(curl -s -o /dev/null -w '%{http_code}' -b old-jar http://127.0.0.1:7575/api/disks)
          test "$code" = 401
          # Le fichier contient des identifiants de session : lisible par le service seulement.
          test "$(sudo stat -c '%a %U' /var/lib/server-dashboard/.revoked-sessions.json)" = "600 server-dashboard"

      # Docker est installé sur les runners GitHub : l'installation doit donner l'accès au service.
      - name: Panneau Docker accessible au service
        run: curl -fsS http://127.0.0.1:7575/api/docker/containers | grep -q '"available":true'

      - name: Mise à jour (2e passage) en gardant la config
        run: |
          sudo SD_SOURCE_DIR="$GITHUB_WORKSPACE" bash packaging/install.sh
          systemctl is-active server-dashboard
          sudo grep -q '"title": "CI"' /var/lib/server-dashboard/config.json
          sudo grep -q '^ADMIN_PASSWORD=ci-test$' /etc/server-dashboard/server-dashboard.env

      - name: Désinstallation
        run: |
          sudo bash packaging/install.sh --uninstall
          ! systemctl is-active server-dashboard
          test ! -d /opt/server-dashboard
          # Le dossier n'est lisible que par root et le service : il contient le mot de passe.
          sudo test -f /etc/server-dashboard/server-dashboard.env
          ! test -r /etc/server-dashboard/server-dashboard.env

      - name: Logs du service en cas d'échec
        if: failure()
        run: sudo journalctl -u server-dashboard -n 100 --no-pager

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Construction de l'image
        run: docker build -t server-dashboard:ci .

      - name: Le conteneur démarre et répond
        run: |
          docker run -d --name sd -p 7575:7575 -e ADMIN_PASSWORD=ci-test -e SERVER_NAME=ci -e DISK_PATH=/host \
            -v /:/host:ro -v /var/run/docker.sock:/var/run/docker.sock server-dashboard:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:7575/api/me && break; sleep 1; done
          echo "Node dans l'image : $(docker exec sd node -v)"
          curl -fsS http://127.0.0.1:7575/ | grep -q "Server Dashboard"
          curl -fsS http://127.0.0.1:7575/api/system | grep -q '"hostname":"ci"'
          curl -fsS http://127.0.0.1:7575/api/docker/containers | grep -q '"name":"sd"'
          curl -fsS -c jar -H 'Content-Type: application/json' -d '{"password":"ci-test"}' http://127.0.0.1:7575/api/login
          # Le disque de l'hôte, monté en /host, doit être détecté et affiché par défaut.
          curl -fsS -b jar http://127.0.0.1:7575/api/disks | grep -q '"path":"/host"'
          curl -fsS http://127.0.0.1:7575/api/system | grep -q '"path":"/host"'

      - name: Logs du conteneur en cas d'échec
        if: failure()
        run: docker logs sd
